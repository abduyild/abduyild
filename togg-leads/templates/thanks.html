{% extends "base.html" %}
{% block title %}{{ t('thanks_title') }} {{ t('thanks_title_accent') }} – {{ cfg.brand_name }}{% endblock %}
{% block body %}
<main class="page center">
  <header class="brand">{% include "_logo.html" %}</header>
  <div class="check-circle">✓</div>
  <h1 class="headline">{{ t('thanks_title') }} <span class="accent">{{ t('thanks_title_accent') }}</span></h1>
  <p class="sub">{{ t('thanks_text') }}</p>
  <a class="btn outline" href="{{ url_for('index') }}">Zurück</a>
</main>
{% endblock %}
